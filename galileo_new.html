<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galileo · Dashboard Marketing JPO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
  <style>
/* ============================================================
   GALILEO · styles v2 — Vue Campus étendue
   ============================================================ */
:root {
  --paper: #f4f4f2; --card: #ffffff; --card-2: #f7f7f5; --ink: #1c1c1e; --muted: #86868b;
  --line: #ededec; --accent: #2f6bff;
  --c1: #2f6bff; --c2: #15b079; --c3: #f5a623; --c4: #9b6cff; --c5: #ff6a5d;
  --good: #18a06a; --warn: #df9526; --bad: #ff5b50;
  --radius: 24px; --radius-sm: 14px; --pad: 26px; --gap: 20px;
  --shadow-sm: 0 1px 2px rgba(20,22,40,.04), 0 1px 3px rgba(20,22,40,.04);
  --shadow: 0 1px 2px rgba(20,22,40,.04), 0 10px 30px rgba(20,22,40,.06);
  --shadow-lg: 0 2px 6px rgba(20,22,40,.05), 0 20px 50px rgba(20,22,40,.09);
  --sans: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --display: var(--sans);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--sans); color: var(--ink); background: var(--paper);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-size: 14.5px; line-height: 1.45; letter-spacing: -0.006em;
}
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -0.02em; }
button { font-family: inherit; cursor: pointer; }
em { font-style: normal; }

/* App shell */
.app { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
.sidebar {
  background: transparent; display: flex; flex-direction: column;
  padding: 22px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 6px 10px 26px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: var(--ink); color: #fff; font-size: 15px; box-shadow: var(--shadow-sm);
}
.brand-txt { display: flex; flex-direction: column; line-height: 1.15; }
.brand-txt strong { font-size: 18px; font-weight: 800; letter-spacing: -0.03em; }
.brand-txt span { font-size: 11.5px; color: var(--muted); font-weight: 500; }

.nav { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
.nav-section-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
  font-weight: 700; padding: 14px 14px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 0; border-radius: 13px;
  background: transparent; color: var(--muted); font-size: 14px; text-align: left; width: 100%;
  transition: background .18s, color .18s; font-weight: 600; letter-spacing: -0.01em;
}
.nav-item:hover { background: rgba(0,0,0,.035); color: var(--ink); }
.nav-item.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }
.nav-item.active svg { color: var(--accent); }
.nav-item svg { flex: none; opacity: .9; }
.nav-sub { padding-left: 16px; }
.nav-sub .nav-item { font-size: 13px; padding: 9px 14px; border-radius: 10px; }

.side-foot { margin-top: auto; padding-top: 16px; }
.upload-box { border-radius: 18px; padding: 16px; background: var(--card); box-shadow: var(--shadow-sm); }
.ub-title { margin: 0 0 5px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.ub-name { margin: 0 0 12px; font-size: 13px; font-weight: 700; color: var(--ink); word-break: break-word; }
.ub-error { margin: -7px 0 11px; font-size: 12px; color: var(--bad); font-weight: 600; }
.ub-btn {
  width: 100%; padding: 10px; border: 0; border-radius: 12px; background: var(--ink); color: #fff;
  font-size: 13px; font-weight: 700; transition: transform .12s, opacity .15s; letter-spacing: -0.01em;
}
.ub-btn:hover { opacity: .9; }
.ub-btn:active { transform: scale(.98); }
.ub-link { display: block; width: 100%; margin-top: 9px; padding: 4px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; }
.ub-link:hover { color: var(--ink); }

/* Main */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
  padding: 30px 38px 16px; background: transparent; position: sticky; top: 0; z-index: 5;
  backdrop-filter: blur(8px);
}
.crumb { margin: 0 0 7px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.page-title { font-family: var(--display); font-size: 30px; font-weight: 800; letter-spacing: -0.035em; }
.topbar-right { display: flex; align-items: center; gap: 11px; }
.period-chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 999px;
  background: var(--card); font-size: 12.5px; color: var(--muted); font-weight: 600; box-shadow: var(--shadow-sm);
}
.pc-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.import-cta {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 17px; border-radius: 999px;
  background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; user-select: none; border: 0;
  box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 34%, transparent); transition: transform .12s, filter .15s; cursor: pointer;
}
.import-cta:hover { filter: brightness(1.05); }
.import-cta:active { transform: scale(.97); }

.flash {
  margin: 14px 38px -4px; padding: 12px 17px; border-radius: 14px; font-size: 13px; font-weight: 600;
  background: color-mix(in srgb, var(--good) 12%, var(--card)); color: var(--good);
}
.content { padding: 22px 38px 52px; }
.view { display: flex; flex-direction: column; gap: var(--gap); }

/* Grids */
.grid { display: grid; gap: var(--gap); }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.grid-dash { grid-template-columns: 1.35fr 1fr; }
.grid-dash .span-insights { grid-column: 1 / -1; }
.grid-funnelfocus { grid-template-columns: 1.3fr 1fr; }
.grid-funnelfocus .span-funnel { grid-row: span 2; }

.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); }
.kpi-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
.kpi-row-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--gap); }

/* Card */
.card {
  background: var(--card); border-radius: var(--radius); padding: var(--pad); min-width: 0;
  box-shadow: var(--shadow-sm); transition: box-shadow .2s;
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
.card-head > div:first-child { min-width: 0; }
.card-head .legend { flex: none; }
.card-title { font-family: var(--display); font-size: 18px; font-weight: 800; letter-spacing: -0.028em; }
.card-sub { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); font-weight: 500; }
.card-action { color: var(--muted); }

/* KPI */
.kpi {
  background: var(--card); border-radius: var(--radius); padding: 22px 24px;
  display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-sm); transition: transform .18s, box-shadow .18s;
}
.kpi:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.kpi-top { display: flex; align-items: center; justify-content: space-between; }
.kpi-label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.kpi-value { font-size: 36px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
.kpi-foot { display: flex; align-items: center; gap: 7px; }
.kpi-sub { font-size: 12px; font-weight: 600; }
.kpi .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.icon-pastille { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.icon-pastille.on-accent { background: var(--accent); color: #fff; }
.substats { display: flex; gap: 14px; flex-wrap: wrap; }
.substat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
.substat-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.substat em { font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }

/* Funnel */
.funnel { display: flex; flex-direction: column; gap: 16px; }
.funnel-row { display: flex; flex-direction: column; gap: 7px; }
.funnel-meta { display: flex; align-items: baseline; justify-content: space-between; }
.funnel-label { font-size: 13px; font-weight: 700; color: var(--ink); }
.funnel-val { font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
.funnel-track { position: relative; height: 34px; background: var(--card-2); border-radius: 11px; overflow: hidden; }
.funnel-bar { height: 100%; border-radius: 11px; transition: width .6s cubic-bezier(.2,.7,.3,1); }
.funnel-conv {
  position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
  font-size: 11.5px; font-weight: 700; color: var(--muted); background: var(--card); padding: 3px 9px; border-radius: 8px; box-shadow: var(--shadow-sm);
}

/* Hero card (taux présence) */
.hero-card {
  background: var(--accent); color: #fff; border-radius: var(--radius); padding: var(--pad);
  display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow);
}
.hero-head { display: flex; align-items: center; justify-content: space-between; }
.hero-eyebrow { font-size: 12.5px; font-weight: 700; opacity: .82; }
.hero-gauge { display: flex; justify-content: center; }
.hero-note { margin: 0; font-size: 12.5px; opacity: .78; font-weight: 500; line-height: 1.55; }

/* Per-levier */
.levier-table { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 11px; }
.levier-line { display: grid; grid-template-columns: 1.6fr .8fr .8fr .7fr; align-items: center; gap: 8px; }
.lt-name { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; }
.lt-metric { font-size: 11.5px; color: var(--muted); text-align: right; font-weight: 500; }
.lt-metric em { display: block; font-size: 14px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }

.legend { display: flex; gap: 15px; flex-wrap: wrap; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
.legend-dot { width: 9px; height: 9px; border-radius: 4px; flex: none; }

/* SVG chart text */
.bar-val { font-size: 12.5px; font-weight: 800; fill: var(--ink); font-variant-numeric: tabular-nums; font-family: var(--sans); }
.bar-lab { font-size: 12px; fill: var(--muted); font-family: var(--sans); font-weight: 600; }
.axis-txt { font-size: 10.5px; fill: var(--muted); font-family: var(--sans); font-weight: 500; }
.axis-cap { font-size: 11px; fill: var(--muted); font-family: var(--sans); font-weight: 600; }

/* Gauge / Donut */
.gauge-v { font-size: 30px; font-weight: 800; fill: var(--ink); font-family: var(--sans); font-variant-numeric: tabular-nums; }
.gauge-l { font-size: 11px; fill: var(--muted); font-family: var(--sans); font-weight: 600; }
.donut-row { display: flex; align-items: center; gap: 26px; }
.donut-wrap { flex: none; }
.donut-legend { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
.dl-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
.dl-name { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dl-val { font-weight: 800; font-variant-numeric: tabular-nums; }

/* Segbar */
.segbar { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.segbar-marks { display: flex; }
.segbar-mark { font-size: 11px; font-weight: 800; color: var(--muted); text-align: center; padding-bottom: 4px; }
.segbar-track { display: flex; height: 14px; border-radius: 8px; overflow: hidden; gap: 2px; }
.segbar-seg { border-radius: 8px; transition: flex .4s; }
.segbar-legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 8px; }
.segbar-li { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; }
.segbar-li em { font-weight: 800; color: var(--ink); margin-left: 4px; }

/* Insights */
.insights { display: grid; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); gap: 16px; }
.insight { border-radius: 18px; padding: 18px; }
.insight-good { background: color-mix(in srgb, var(--good) 9%, var(--card)); }
.insight-warn { background: color-mix(in srgb, var(--warn) 11%, var(--card)); }
.insight-bad { background: color-mix(in srgb, var(--bad) 9%, var(--card)); }
.insight-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 800; }
.insight-tag::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.insight-good .insight-tag { color: var(--good); }
.insight-warn .insight-tag { color: var(--warn); }
.insight-bad .insight-tag { color: var(--bad); }
.insight h4 { margin: 9px 0 6px; font-size: 14.5px; font-weight: 800; letter-spacing: -0.02em; }
.insight p { margin: 0; font-size: 12.8px; color: var(--muted); line-height: 1.55; font-weight: 500; }

/* HBars */
.hbars { display: flex; flex-direction: column; gap: 11px; }
.hbar-row { display: grid; grid-template-columns: 132px 1fr auto; align-items: center; gap: 13px; }
.hbar-label { font-size: 12.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.hbar-track { height: 12px; background: var(--card-2); border-radius: 7px; overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 7px; transition: width .5s cubic-bezier(.2,.7,.3,1); }
.hbar-val { font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 50px; text-align: right; }

/* Dual metric */
.dual-list { display: flex; flex-direction: column; gap: 16px; }
.dual-row { display: grid; grid-template-columns: 1fr; gap: 9px; padding-bottom: 15px; border-bottom: 1px solid var(--line); }
.dual-row:last-child { border-bottom: 0; padding-bottom: 0; }
.dual-name { display: flex; align-items: center; font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
.dual-bars { display: flex; flex-direction: column; gap: 7px; }
.dual-line { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 11px; }
.dual-k { font-size: 10.5px; font-weight: 800; color: var(--muted); letter-spacing: .03em; }
.dual-track { height: 10px; background: var(--card-2); border-radius: 6px; overflow: hidden; }
.dual-fill { height: 100%; border-radius: 6px; transition: width .5s cubic-bezier(.2,.7,.3,1); }
.dual-v { font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }

/* Table */
.table-wrap { overflow-x: auto; margin: 0 -6px; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  text-align: right; padding: 10px 13px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; user-select: none;
}
.data-table th.tl, .data-table td.tl { text-align: left; }
.data-table th.tr, .data-table td.tr { text-align: right; }
.data-table th:hover { color: var(--ink); }
.data-table td { padding: 13px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; font-weight: 500; }
.data-table tbody tr { transition: background .12s; }
.data-table tbody tr:hover { background: var(--card-2); }
.data-table tbody tr:last-child td { border-bottom: 0; }
.data-table td.tl { font-weight: 600; }
.lev-chip { display: inline-block; padding: 3px 8px; border-radius: 7px; color: #fff; font-size: 10.5px; font-weight: 800; margin-right: 10px; vertical-align: middle; }
.cell-good { color: var(--good); font-weight: 800; }
.cell-bad { color: var(--bad); font-weight: 800; }
.strong { font-weight: 800; }
.muted { color: var(--muted); }
.rank-cell { color: var(--muted); font-weight: 800; }
.presence-pill { display: inline-block; padding: 3px 11px; border-radius: 999px; font-weight: 800; font-size: 12px; color: var(--pc); background: color-mix(in srgb, var(--pc) 14%, transparent); }
.sort-ar { color: var(--accent); }

.seg { display: inline-flex; background: var(--card-2); border-radius: 12px; padding: 4px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 15px; border-radius: 9px; font-size: 12.5px; color: var(--muted); font-weight: 700; transition: all .14s; }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow-sm); }

/* VS créatifs */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 6px 0 20px; }
.vs-col { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 20px; border-radius: 18px; background: color-mix(in srgb, var(--vc) 9%, var(--card-2)); }
.vs-name { font-size: 13px; font-weight: 800; color: var(--vc); letter-spacing: -0.01em; }
.vs-big { font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.04em; }
.vs-big small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 5px; }
.vs-mid { font-size: 14px; font-weight: 700; color: var(--muted); }
.vs-metrics { border-top: 1px solid var(--line); padding-top: 6px; }
.vsm-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.vsm-row:last-child { border-bottom: 0; }
.vsm-v { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.vsm-row .vsm-v:first-child { text-align: left; }
.vsm-row .vsm-v:last-child { text-align: right; }
.vsm-k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 0 14px; font-weight: 700; }

/* Rank list */
.ranklist { display: flex; flex-direction: column; gap: 10px; }
.rank-row { display: grid; grid-template-columns: 30px 1fr auto auto; align-items: center; gap: 13px; padding: 13px 15px; border-radius: 15px; background: var(--card-2); }
.rank-row.good { background: color-mix(in srgb, var(--good) 8%, var(--card-2)); }
.rank-row.bad { background: color-mix(in srgb, var(--bad) 8%, var(--card-2)); }
.rank-n { font-size: 17px; font-weight: 800; color: var(--muted); text-align: center; }
.rank-row.good .rank-n { color: var(--good); }
.rank-row.bad .rank-n { color: var(--bad); }
.rank-name { font-size: 13.5px; font-weight: 700; display: flex; flex-direction: column; letter-spacing: -0.01em; }
.rank-name small { font-size: 11px; font-weight: 700; margin-top: 1px; }
.rank-metric { font-size: 11px; color: var(--muted); text-align: right; font-weight: 500; }
.rank-metric em { display: block; font-size: 14px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }

/* ============ CAMPUS VIEW EXTENSIONS ============ */

/* Campus selector tabs */
.campus-tabs {
  display: flex; gap: 8px; padding: 4px; background: var(--card); border-radius: 18px;
  box-shadow: var(--shadow-sm); flex-wrap: wrap;
}
.campus-tab {
  padding: 9px 18px; border: 0; border-radius: 13px; font-size: 13px; font-weight: 700;
  color: var(--muted); background: transparent; transition: all .15s; cursor: pointer; letter-spacing: -0.01em;
}
.campus-tab:hover { color: var(--ink); background: var(--card-2); }
.campus-tab.active { background: var(--accent); color: #fff; box-shadow: 0 2px 8px color-mix(in srgb,var(--accent) 30%,transparent); }
.campus-tab.hq { font-size: 12px; letter-spacing: .01em; }

/* Campus header banner */
.campus-banner {
  background: var(--card); border-radius: var(--radius); padding: 24px 28px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  box-shadow: var(--shadow-sm); border-left: 4px solid var(--accent);
}
.campus-banner-info { display: flex; flex-direction: column; gap: 4px; }
.campus-banner-label { font-size: 11.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.campus-banner-name { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
.campus-banner-meta { font-size: 13px; color: var(--muted); font-weight: 500; }
.campus-badge {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 999px;
  font-size: 12px; font-weight: 800; letter-spacing: .02em;
}
.campus-badge.hq { background: color-mix(in srgb,var(--c4) 12%,transparent); color: var(--c4); }
.campus-badge.campus { background: color-mix(in srgb,var(--accent) 12%,transparent); color: var(--accent); }

/* Anonymized benchmark */
.bench-card {
  background: var(--card); border-radius: var(--radius); padding: var(--pad);
  box-shadow: var(--shadow-sm);
}
.bench-row {
  display: grid; grid-template-columns: 1fr auto auto auto; align-items: center;
  gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 13px;
}
.bench-row:last-child { border-bottom: 0; }
.bench-label { font-weight: 700; }
.bench-my { font-weight: 800; font-variant-numeric: tabular-nums; }
.bench-avg { font-size: 12px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.bench-delta {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 8px;
  font-size: 11.5px; font-weight: 800; font-variant-numeric: tabular-nums;
}
.bench-delta.up { background: color-mix(in srgb,var(--good) 12%,transparent); color: var(--good); }
.bench-delta.down { background: color-mix(in srgb,var(--bad) 12%,transparent); color: var(--bad); }
.bench-delta.eq { background: color-mix(in srgb,var(--warn) 10%,transparent); color: var(--warn); }

/* Journal de bord */
.journal { display: flex; flex-direction: column; gap: 12px; }
.journal-entry {
  display: grid; grid-template-columns: 3px 1fr; gap: 16px; align-items: start;
}
.journal-stripe { border-radius: 3px; align-self: stretch; min-height: 40px; }
.journal-body { display: flex; flex-direction: column; gap: 5px; padding: 2px 0; }
.journal-date { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.journal-title { font-size: 14px; font-weight: 800; letter-spacing: -0.01em; }
.journal-text { font-size: 12.5px; color: var(--muted); line-height: 1.55; font-weight: 500; }
.journal-actions { display: flex; gap: 8px; margin-top: 6px; }
.journal-action-btn {
  padding: 5px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
  font-size: 12px; font-weight: 700; color: var(--ink); cursor: pointer; transition: all .14s;
}
.journal-action-btn:hover { background: var(--card-2); border-color: var(--muted); }
.journal-action-btn.primary { background: var(--accent); color: #fff; border-color: transparent; }

/* Simulateur JPO */
.simulator { display: flex; flex-direction: column; gap: 20px; }
.sim-controls { display: flex; flex-direction: column; gap: 14px; }
.sim-row { display: grid; grid-template-columns: 160px 1fr 80px; align-items: center; gap: 14px; }
.sim-label { font-size: 13px; font-weight: 700; color: var(--ink); }
.sim-range {
  -webkit-appearance: none; appearance: none; height: 6px; border-radius: 4px;
  background: var(--card-2); outline: none; cursor: pointer; width: 100%;
}
.sim-range::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent); cursor: pointer;
}
.sim-val { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.sim-results { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.sim-kpi {
  background: var(--card-2); border-radius: 18px; padding: 16px 18px; display: flex;
  flex-direction: column; gap: 6px; transition: background .2s;
}
.sim-kpi-label { font-size: 11.5px; color: var(--muted); font-weight: 700; }
.sim-kpi-value { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.sim-kpi-sub { font-size: 11.5px; color: var(--muted); font-weight: 500; }

/* Top visuels */
.visuels-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.visuel-card {
  background: var(--card-2); border-radius: 18px; overflow: hidden;
  transition: transform .18s, box-shadow .18s; cursor: pointer;
}
.visuel-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.visuel-thumb {
  width: 100%; aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 800; letter-spacing: -0.04em; color: rgba(255,255,255,.9);
  font-family: var(--sans);
}
.visuel-meta { padding: 13px 15px; display: flex; flex-direction: column; gap: 5px; }
.visuel-name { font-size: 13px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.visuel-kpis { display: flex; gap: 14px; }
.visuel-kpi { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.visuel-kpi em { color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }
.visuel-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 6px; color: #fff; display: inline-block; margin-bottom: 4px; }

/* Filter bar */
.filter-bar {
  background: var(--card); border-radius: 18px; padding: 14px 20px;
  display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow-sm); flex-wrap: wrap;
}
.filter-bar-label { font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.filter-select {
  padding: 8px 14px; border: 1px solid var(--line); border-radius: 11px; background: var(--card-2);
  font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer;
  outline: none; transition: border-color .15s;
}
.filter-select:focus { border-color: var(--accent); }
.filter-divider { width: 1px; height: 22px; background: var(--line); flex: none; }

/* Device split */
.device-split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.device-item {
  background: var(--card-2); border-radius: 16px; padding: 16px 18px;
  display: flex; align-items: center; gap: 14px;
}
.device-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.device-info { display: flex; flex-direction: column; gap: 3px; }
.device-name { font-size: 12.5px; font-weight: 700; }
.device-val { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.device-sub { font-size: 11.5px; color: var(--muted); font-weight: 500; }

/* Density */
[data-density="compact"] { --pad: 18px; --gap: 14px; --radius: 18px; }
[data-density="compact"] .kpi { padding: 16px 18px; }
[data-density="compact"] .kpi-value { font-size: 30px; }
[data-density="compact"] .content { padding: 16px 26px 38px; }
[data-density="compact"] .topbar { padding: 20px 26px 12px; }

/* Responsive */
@media (max-width: 1100px) {
  .grid-2, .grid-3, .grid-dash, .grid-funnelfocus { grid-template-columns: 1fr; }
  .grid-dash .span-insights { grid-column: auto; }
  .kpi-row, .kpi-row-5 { grid-template-columns: 1fr 1fr; }
  .sim-results { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .kpi-row { grid-template-columns: 1fr 1fr; }
}

(function () {

    return Object.values(g).map((x) => ({ ...x, taux: x.leads > 0 ? x.venus / x.leads : 0 })).sort((a, b) => b.leads - a.leads);
  }

  function insights(rows) {
    const out = [];
    const a = aggregate(rows);
    const sma = a.parLevier.find((x) => x.levier === 'SMA');
    const sea = a.parLevier.find((x) => x.levier === 'SEA');
    if (sma && sea && sea.cpl > 0 && sma.cpl > 0) {
      if (sea.cpl < sma.cpl) {
        const ecart = Math.round((1 - sea.cpl / sma.cpl) * 100);
        out.push({ tone: 'good', titre: 'Le SEA convertit moins cher', texte: `CPL SEA ${eur2(sea.cpl)} contre ${eur2(sma.cpl)} en SMA — soit ${ecart}% moins cher. Arbitrer une part du budget Meta vers Google.` });
      } else {
        out.push({ tone: 'good', titre: 'Le SMA reste compétitif', texte: `CPL SMA ${eur2(sma.cpl)} vs ${eur2(sea.cpl)} en SEA.` });
      }
    }
    const sea2 = campaignRows(rows).filter((c) => c.levier === 'SEA');
    const lp = sea2.find((c) => /landing/i.test(c.label));
    const site = sea2.find((c) => /site/i.test(c.label) && !/landing/i.test(c.label));
    if (lp && site && lp.cpl > 0 && site.cpl > 0 && lp.cpl < site.cpl) {
      out.push({ tone: 'good', titre: 'Les Landing Pages écrasent le CPL', texte: `La landing dédiée sort un CPL de ${eur2(lp.cpl)} (CVR ${pct(lp.cvr)}) contre ${eur2(site.cpl)} pour le site. Router tout le trafic payant vers la landing.` });
    }
    const ca = creativeAnalysis(rows);
    if (ca.zeroConv.length) {
      const gaspille = sum(ca.zeroConv, 'cout');
      out.push({ tone: 'bad', titre: `${ca.zeroConv.length} créa${ca.zeroConv.length > 1 ? 's' : ''} sans conversion`, texte: `${ca.zeroConv.length} créas SMA ont généré des clics mais 0 lead — ${eur(gaspille)} de budget sans retour.` });
    }
    const camp = campusRanking(rows).filter((c) => c.leads >= 15);
    if (camp.length) {
      const low = [...camp].sort((x, y) => x.taux - y.taux)[0];
      if (low && low.taux < 0.28) {
        out.push({ tone: 'warn', titre: `Présence faible — ${shortCampus(low.campus)}`, texte: `Seulement ${pct(low.taux, 0)} de présence sur ${low.campus} (${low.venus}/${low.leads}). Renforcer les relances SMS/e-mail J-3.` });
      }
    }
    if (ca.top[0]) {
      out.push({ tone: 'good', titre: `Créa gagnante : ${ca.top[0].name}`, texte: `${ca.top[0].type} — ${ca.top[0].leads} leads à ${eur2(ca.top[0].cpl)} de CPL. Décliner ce format sur les prochaines campagnes.` });
    }
    return out;
  }

  function journalInsights(campusData, avgData) {
    const entries = [];
    if (campusData.tauxPresence < 0.25) {
      entries.push({
        tone: 'bad', date: 'Alerte', title: 'Taux de présence sous les 25 %',
        text: `Avec ${pct(campusData.tauxPresence, 0)} de présence, ce campus est en deçà du seuil critique. Action requise : renforcer les relances J-7 et J-3 par SMS et e-mail personnalisé.`,
        actions: ['Planifier relances', 'Voir les non-venus']
      });
    } else if (campusData.tauxPresence >= 0.3) {
      entries.push({
        tone: 'good', date: 'Objectif atteint', title: 'Taux de présence au-dessus de l\'objectif',
        text: `${pct(campusData.tauxPresence, 0)} de présence — objectif 30 % dépassé. Capitaliser sur les sources qui convertissent le mieux pour la prochaine JPO.`,
        actions: ['Voir les sources top']
      });
    } else {
      entries.push({
        tone: 'warn', date: 'À surveiller', title: 'Taux de présence proche du seuil',
        text: `${pct(campusData.tauxPresence, 0)} de présence. Quelques relances ciblées pourraient faire passer ce campus au-dessus des 30 %.`,
        actions: ['Planifier relances']
      });
    }
    if (campusData.leads > avgData.avgLeads * 1.1) {
      entries.push({
        tone: 'good', date: 'Performance', title: 'Volume de leads supérieur à la moyenne réseau',
        text: `Ce campus a généré ${intf(campusData.leads)} leads, soit +${Math.round((campusData.leads / avgData.avgLeads - 1) * 100)}% par rapport à la moyenne réseau. La stratégie d'acquisition CPC est efficace.`,
        actions: ['Voir le détail sources']
      });
    }
    entries.push({
      tone: 'info', date: 'Recommandation', title: 'Préparer le brief JPO suivant',
      text: `Sur la base des données de cette JPO, le CPL moyen réseau est ${eur2(avgData.avgCPL)}. Définissez votre budget pour la prochaine JPO avec le simulateur.`,
      actions: ['Ouvrir le simulateur']
    });
    return entries;
  }

  // Anonymized network average (excluding the viewed campus)
  function networkAvg(allRows, excludeCampus) {
    const crm = allRows.filter((r) => r.levier === 'CRM' && r.campus !== excludeCampus);
    const g = {};
    for (const r of crm) {
      const c = r.campus;
      if (!g[c]) g[c] = { leads: 0, venus: 0 };
      g[c].leads += num(r.nbLeads); g[c].venus += num(r.nbVenus);
    }
    const campuses = Object.values(g).filter((x) => x.leads > 5);
    const avgLeads = campuses.length > 0 ? sum(campuses, 'leads') / campuses.length : 0;
    const avgTaux = campuses.length > 0 ? campuses.reduce((s, x) => s + (x.leads > 0 ? x.venus / x.leads : 0), 0) / campuses.length : 0;
    const paid = allRows.filter((r) => r.levier !== 'CRM');
    const totalCout = sum(paid, 'cout'); const totalLeads = sum(paid, 'leads');
    const avgCPL = totalLeads > 0 ? totalCout / totalLeads : 0;
    return { avgLeads, avgTaux, avgCPL, count: campuses.length };
  }

  function shortCampus(c) { return (c || '').replace('ESG Luxe', '').trim() || 'Paris'; }

  // XLSX parser (same as original)
  const HEADER_MAP = [
    ['temps fort','tempsFort'],['periode','periode'],['levier','levier'],['sous-levier','sousLevier'],
    ['mois','mois'],['annee','annee'],['campaign name','campaign'],['adset name','adset'],['ad name','ad'],
    ['type de page','typePage'],['url','url'],['impressions','impressions'],['clics','clics'],['ctr','ctr'],
    ['cout','cout'],['cout (€)','cout'],['leads/conversions','leads'],['leads','leads'],['cpl/cpa (€)','cpl'],
    ['cpl','cpl'],['cvr','cvr'],['cpc (€)','cpc'],['cpc','cpc'],['campus','campus'],
    ['support campagne','support'],['support','support'],['nb leads','nbLeads'],['nb venus','nbVenus'],
    ['nb non venus','nbNonVenus'],['nb confirmes','nbConfirmes'],['taux presence','tauxPresence'],
  ];
  const NUM_FIELDS = ['impressions','clics','ctr','cout','leads','cpl','cvr','cpc','nbLeads','nbVenus','nbNonVenus','nbConfirmes','tauxPresence'];
  function normHeader(s) { return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim(); }
  function fieldFor(h) { const nh=normHeader(h); for (const [k,v] of HEADER_MAP) if(nh===k) return v; return null; }
  async function inflateRaw(bytes) {
    const ds=new DecompressionStream('deflate-raw');
    const stream=new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  function colToIdx(c){let n=0;for(const ch of c)n=n*26+(ch.charCodeAt(0)-64);return n-1;}
  function decodeEntities(s){return(s||'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(n));}
  async function parseXlsx(arrayBuffer) {
    const buf=new Uint8Array(arrayBuffer); const dv=new DataView(buf.buffer);
    const u16=(o)=>dv.getUint16(o,true),u32=(o)=>dv.getUint32(o,true);
    let eocd=-1; for(let i=buf.length-22;i>=0;i--){if(u32(i)===0x06054b50){eocd=i;break;}}
    if(eocd<0)throw new Error('Fichier .xlsx invalide');
    const cdCount=u16(eocd+10);let cdOff=u32(eocd+16); const files={};let p=cdOff;
    for(let i=0;i<cdCount;i++){
      const method=u16(p+10),compSize=u32(p+20),nameLen=u16(p+28),extraLen=u16(p+30),commentLen=u16(p+32),localOff=u32(p+42);
      const name=new TextDecoder().decode(buf.subarray(p+46,p+46+nameLen));
      const lNameLen=u16(localOff+26),lExtraLen=u16(localOff+28);
      const dataStart=localOff+30+lNameLen+lExtraLen;
      files[name]={method,data:buf.subarray(dataStart,dataStart+compSize)};
      p+=46+nameLen+extraLen+commentLen;
    }
    async function getText(name){const f=files[name];if(!f)return null;return new TextDecoder().decode(f.method===0?f.data:await inflateRaw(f.data));}
    const sharedXml=await getText('xl/sharedStrings.xml'); const sst=[];
    if(sharedXml){const re=/<si>([\s\S]*?)<\/si>/g;let m;while((m=re.exec(sharedXml))){const texts=[...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map((x)=>x[1]);sst.push(decodeEntities(texts.join('')));}}
    let sheetName='xl/worksheets/sheet1.xml';
    if(!files[sheetName])sheetName=Object.keys(files).find((n)=>/xl\/worksheets\/sheet\d+\.xml$/.test(n));
    const sheet=await getText(sheetName);
    const rowRe=/<row[^>]*r="(\d+)"[^>]*>([\s\S]*?)<\/row>/g;let rm;const grid=[];
    while((rm=rowRe.exec(sheet))){
      const cells={};const cellRe=/<c r="([A-Z]+)\d+"(?:[^>]*t="(\w+)")?[^>]*>(?:<v>([\s\S]*?)<\/v>|<is><t[^>]*>([\s\S]*?)<\/t><\/is>)?<\/c>/g;let cm;
      while((cm=cellRe.exec(rm[2]))){let col=cm[1],type=cm[2],val=cm[3];const inline=cm[4];
        if(inline!==undefined)val=decodeEntities(inline);else if(type==='s')val=sst[parseInt(val)];
        cells[colToIdx(col)]=val;}
      grid.push(cells);
    }
    let headerIdx=-1;
    for(let i=0;i<Math.min(grid.length,8);i++){const vals=Object.values(grid[i]).map(normHeader);if(vals.includes('levier')&&vals.some((v)=>v.includes('campaign'))){headerIdx=i;break;}}
    if(headerIdx<0)throw new Error('En-têtes introuvables');
    const colFields={};for(const[ci,v]of Object.entries(grid[headerIdx])){const f=fieldFor(v);if(f)colFields[ci]=f;}
    const rows=[];
    for(let i=headerIdx+1;i<grid.length;i++){
      const o={};for(const[ci,f]of Object.entries(colFields)){let v=grid[i][ci];if(v===undefined)v=null;o[f]=NUM_FIELDS.includes(f)?(v==null||v===''?null:Number(v)):v;}
      if(!o.levier&&!o.campaign)continue; rows.push(o);
    }
    if(!rows.length)throw new Error('Aucune ligne de données trouvée');
    return rows;
  }

  window.JPO = { num, eur, eur2, pct, intf, sum, LEVIERS, LEVIER_LABEL, creativeType, creativeName,
    aggregate, campaignRows, creativeAnalysis, campusRanking, sourceBreakdown, insights,
    journalInsights, networkAvg, shortCampus, parseXlsx };
})();
  </script>

  <!-- CHARTS -->
  <script type="text/babel">
(function () {
const { useState, useRef, useEffect } = React;
const fmtFR = (n, d=0) => Number(n||0).toLocaleString('fr-FR', { maximumFractionDigits: d });

function KpiCard({ label, value, sub, tone='neutral', icon, iconColor, chips }) {
  const toneVar = tone==='good'?'var(--good)':tone==='bad'?'var(--bad)':tone==='warn'?'var(--warn)':'var(--ink)';
  const ic = iconColor||'var(--accent)';
  return (
    <div className="kpi">
      <div className="kpi-top">
        <span className="kpi-label">{label}</span>
        {icon?<span className="icon-pastille" style={{background:`color-mix(in srgb, ${ic} 15%, transparent)`,color:ic}}>{icon}</span>:null}
      </div>
      <div className="kpi-value" style={{color:tone==='neutral'?'var(--ink)':toneVar}}>{value}</div>
      {chips&&chips.length?(
        <div className="substats">{chips.map((c,i)=>(
          <span className="substat" key={i}><span className="substat-dot" style={{background:c.color||'var(--muted)'}} /><em>{c.v}</em>{c.k}</span>
        ))}</div>
      ):(
        <div className="kpi-foot">
          {tone!=='neutral'?<span className="dot" style={{background:toneVar}} />:null}
          <span className="kpi-sub" style={{color:tone==='neutral'?'var(--muted)':toneVar}}>{sub}</span>
        </div>
      )}
    </div>
  );
}

function TickGauge({ value, size=188, ticks=56, sub, on='#ffffff', off='rgba(255,255,255,.26)', center, textColor='#ffffff' }) {
  const cx=size/2,cy=size/2,rOuter=size/2-6,rInner=rOuter-15;
  const v=Math.max(0,Math.min(1,value)); const active=Math.round(v*ticks);
  const lines=[];
  for(let i=0;i<ticks;i++){const ang=(-90+(i/ticks)*360)*Math.PI/180;lines.push(<line key={i} x1={cx+rInner*Math.cos(ang)} y1={cy+rInner*Math.sin(ang)} x2={cx+rOuter*Math.cos(ang)} y2={cy+rOuter*Math.sin(ang)} stroke={i<active?on:off} strokeWidth="2.4" strokeLinecap="round"/>);}
  return (<svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>{lines}
    <text x={cx} y={cy+2} textAnchor="middle" style={{fill:textColor,fontSize:34,fontWeight:800,fontFamily:'var(--sans)'}}>{center!=null?center:Math.round(v*100)+'%'}</text>
    {sub?<text x={cx} y={cy+24} textAnchor="middle" style={{fill:textColor,opacity:.72,fontSize:12,fontWeight:600,fontFamily:'var(--sans)'}}>{sub}</text>:null}
  </svg>);
}

function SegBar({ data, total }) {
  const s = total||data.reduce((x,d)=>x+d.value,0)||1;
  return (<div className="segbar">
    <div className="segbar-marks">{data.map((d,i)=><span className="segbar-mark" key={i} style={{width:(d.value/s*100)+'%'}}>{Math.round(d.value/s*100)}%</span>)}</div>
    <div className="segbar-track">{data.map((d,i)=><div className="segbar-seg" key={i} style={{width:(d.value/s*100)+'%',background:d.color}} title={d.label}/>)}</div>
    <div className="segbar-legend">{data.map((d,i)=><span className="segbar-li" key={i}><span className="legend-dot" style={{background:d.color}}/>{d.label}<em>{d.fmt!=null?d.fmt:d.value}</em></span>)}</div>
  </div>);
}

function FunnelChart({ data }) {
  const max=Math.max(...data.map((d)=>d.value),1);
  const colors=['var(--c1)','var(--c2)','var(--c3)','var(--accent)'];
  return (<div className="funnel">{data.map((d,i)=>{
    const w=Math.max((d.value/max)*100,3); const prev=i>0?data[i-1].value:null;
    const conv=prev?(d.value/prev)*100:null;
    return (<div className="funnel-row" key={d.label}>
      <div className="funnel-meta"><span className="funnel-label">{d.label}</span><span className="funnel-val">{fmtFR(d.value)}</span></div>
      <div className="funnel-track">
        <div className="funnel-bar" style={{width:w+'%',background:colors[i%colors.length]}}/>
        {conv!=null?<span className="funnel-conv">{conv.toFixed(conv<10?1:0)}%</span>:null}
      </div>
    </div>);
  })}</div>);
}

function HBars({ rows, format=(v)=>fmtFR(v), accessor=(r)=>r.value, label=(r)=>r.label, color, maxRows }) {
  const data=maxRows?rows.slice(0,maxRows):rows;
  const max=Math.max(...data.map(accessor),1);
  return (<div className="hbars">{data.map((r,i)=>{
    const v=accessor(r); const w=Math.max((v/max)*100,1.5);
    const c=typeof color==='function'?color(r):(color||'var(--accent)');
    return (<div className="hbar-row" key={i}>
      <span className="hbar-label" title={label(r)}>{label(r)}</span>
      <div className="hbar-track"><div className="hbar-fill" style={{width:w+'%',background:c}}/></div>
      <span className="hbar-val">{format(v)}</span>
    </div>);
  })}</div>);
}

function Donut({ data, size=180, thickness=26, centerTop, centerSub }) {
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  const r=size/2-thickness/2-2; const c=2*Math.PI*r; let acc=0;
  return (<div className="donut-wrap"><svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
    <g transform={`rotate(-90 ${size/2} ${size/2})`}>
      {data.map((d,i)=>{const frac=d.value/total;const dash=c*frac;
        const el=<circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={d.color} strokeWidth={thickness} strokeDasharray={`${dash} ${c-dash}`} strokeDashoffset={-acc}/>;
        acc+=dash; return el;})}
    </g>
    {centerTop?<text x={size/2} y={size/2-2} textAnchor="middle" className="gauge-v" style={{fontSize:26}}>{centerTop}</text>:null}
    {centerSub?<text x={size/2} y={size/2+18} textAnchor="middle" className="gauge-l">{centerSub}</text>:null}
  </svg></div>);
}

function GaugeSVG({ value, size=140, color='var(--accent)' }) {
  const r=size/2-12; const circ=2*Math.PI*r; const v=Math.max(0,Math.min(1,value));
  return (<svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--line)" strokeWidth="10"/>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="10" strokeLinecap="round"
      strokeDasharray={`${circ*v} ${circ}`} transform={`rotate(-90 ${size/2} ${size/2})`} style={{transition:'stroke-dasharray .6s ease'}}/>
    <text x={size/2} y={size/2+5} textAnchor="middle" style={{fill:'var(--ink)',fontSize:22,fontWeight:800,fontFamily:'var(--sans)',fontVariantNumeric:'tabular-nums'}}>{Math.round(v*100)}%</text>
  </svg>);
}

Object.assign(window, { KpiCard, TickGauge, SegBar, FunnelChart, HBars, Donut, GaugeSVG, fmtFR });
})();
  </script>

  return (
    <div className="view">
      <div className="kpi-row">
        <KpiCard label="Leads générés" value={J.intf(a.leadsTotal)} icon={<Ico d={ICONS.leads}/>} iconColor="var(--c1)"
          chips={[{v:J.intf(a.venus),k:'présents',color:'var(--good)'},{v:a.confirmes,k:'confirmés',color:'var(--c4)'}]}/>
        <KpiCard label="Coût média total" value={J.eur(a.coutTotal)} icon={<Ico d={ICONS.euro}/>} iconColor="var(--c3)"
          chips={[{v:J.eur(a.parLevier[0].cout),k:'SMA',color:'var(--c1)'},{v:J.eur(a.parLevier[1].cout),k:'SEA',color:'var(--c2)'}]}/>
        <KpiCard label="CPL moyen" value={J.eur2(a.cplMoyen)} tone={cplTone} icon={<Ico d={ICONS.tag}/>} iconColor="var(--c5)"
          sub={cplTone==='good'?'Sous l\'objectif de 25 €':cplTone==='warn'?'Proche du plafond de 40 €':'Au-dessus de l\'objectif'}/>
        <KpiCard label="Taux de présence" value={J.pct(a.tauxPresence,0)} tone={presTone} icon={<Ico d={ICONS.check}/>} iconColor="var(--c2)"
          sub={`${J.intf(a.venus)} présents sur ${J.intf(a.leadsTotal)} leads`}/>
      </div>
      <div className="grid grid-dash">
        <SectionCard title="Funnel d'acquisition" sub="Impressions → Clics → Leads → Présents" className="span-funnel">
          <FunnelChart data={a.funnel}/>
        </SectionCard>
        <div className="hero-card">
          <div className="hero-head">
            <span className="hero-eyebrow">Taux de présence réseau</span>
            <span className="icon-pastille on-accent"><Ico d={ICONS.check}/></span>
          </div>
          <div className="hero-gauge"><TickGauge value={a.tauxPresence} sub={`${J.intf(a.venus)} / ${J.intf(a.leadsTotal)}`}/></div>
          <p className="hero-note">{presTone==='good'?'Objectif de 30 % atteint.':presTone==='bad'?'En deçà de l\'objectif — relances à renforcer.':'Proche de l\'objectif de 30 %.'}</p>
        </div>
        <SectionCard title="Performance par levier" sub="Répartition budget média payant">
          <SegBar data={paidLeviers.map((l)=>({label:l.levier,value:l.cout,color:levierColor(l.levier),fmt:J.eur(l.cout)}))}/>
          <div className="levier-table">{a.parLevier.map((l)=>(
            <div className="levier-line" key={l.levier}>
              <span className="lt-name"><span className="legend-dot" style={{background:levierColor(l.levier)}}/>{J.LEVIER_LABEL[l.levier]}</span>
              <span className="lt-metric"><em>{l.levier==='CRM'?'—':J.eur2(l.cpl)}</em>CPL</span>
              <span className="lt-metric"><em>{l.levier==='CRM'?J.pct(l.venus/(l.leads||1),0):J.pct(l.ctr,2)}</em>{l.levier==='CRM'?'présence':'CTR'}</span>
              <span className="lt-metric"><em>{J.intf(l.leads)}</em>leads</span>
            </div>
          ))}</div>
        </SectionCard>
        <SectionCard title="Origine des leads" sub="Par source d'acquisition (CRM)">
          <div className="donut-row">
            <Donut data={sources.slice(0,6).map((s,i)=>({label:s.source,value:s.leads,color:`var(--c${(i%5)+1})`}))} centerTop={J.intf(a.crmLeads)} centerSub="leads"/>
            <div className="donut-legend">{sources.slice(0,6).map((s,i)=>(
              <div className="dl-row" key={s.source}><span className="legend-dot" style={{background:`var(--c${(i%5)+1})`}}/><span className="dl-name">{s.source}</span><span className="dl-val">{J.intf(s.leads)}</span></div>
            ))}</div>
          </div>
        </SectionCard>
        {showInsights&&<SectionCard title="Insights automatiques" sub="Lecture des performances en langage clair" className="span-insights">
          <div className="insights">{ins.map((it,i)=>(
            <div className={`insight insight-${it.tone}`} key={i}>
              <span className="insight-tag">{it.tone==='good'?'Opportunité':it.tone==='bad'?'Alerte':'À surveiller'}</span>
              <h4>{it.titre}</h4><p>{it.texte}</p>
            </div>
          ))}</div>
        </SectionCard>}
      </div>
    </div>
  );
}

/* ===== CAMPAGNES ===== */
function CampagnesView({ rows }) {
  const all = useMemo(()=>J.campaignRows(rows),[rows]);
  const [filt, setFilt] = useState('Tous');
  const [sort, setSort] = useState({k:'cout',dir:-1});
  const data = useMemo(()=>{let d=filt==='Tous'?all:all.filter((c)=>c.levier===filt);return [...d].sort((x,y)=>(x[sort.k]>y[sort.k]?1:-1)*sort.dir);},[all,filt,sort]);
  const setSortK = (k) => setSort((s)=>({k,dir:s.k===k?-s.dir:-1}));
  const cplSeries = [...all].sort((a,b)=>a.cpl-b.cpl).filter((c)=>c.cpl>0);
  const cols = [
    {k:'label',t:'Campagne',align:'left'},{k:'impressions',t:'Impr.',f:(v)=>fmtFR(v)},
    {k:'clics',t:'Clics',f:(v)=>fmtFR(v)},{k:'ctr',t:'CTR',f:(v)=>J.pct(v,2)},
    {k:'cpc',t:'CPC',f:(v)=>J.eur2(v)},{k:'leads',t:'Leads',f:(v)=>fmtFR(Math.round(v))},
    {k:'cpl',t:'CPL',f:(v)=>v>0?J.eur2(v):'—'},{k:'cvr',t:'CVR',f:(v)=>J.pct(v,2)},
  ];
  return (
    <div className="view">
      <div className="grid grid-2">
        <SectionCard title="CPL par campagne" sub="Du plus efficace au plus cher">
          <HBars rows={cplSeries} accessor={(r)=>r.cpl} label={(r)=>r.label} format={(v)=>J.eur2(v)}
            color={(r)=>r.cpl<=20?'var(--good)':r.cpl>=40?'var(--bad)':levierColor(r.levier)}/>
        </SectionCard>
        <SectionCard title="CTR & CVR par campagne" sub="Même échelle — taux de clic vs conversion"
          right={<Legend items={[{label:'CTR',color:'var(--c1)'},{label:'CVR',color:'var(--c2)'}]}/>}>
          <div className="dual-list">{[...all].sort((a,b)=>b.cvr-a.cvr).map((c)=>{
            const scale=Math.max(...all.map((x)=>Math.max(x.ctr,x.cvr)),0.001);
            const w=(v)=>Math.max((v/scale)*100,1.5)+'%';
            return (<div className="dual-row" key={c.key}>
              <div className="dual-name"><span className="lev-chip" style={{background:levierColor(c.levier)}}>{c.levier}</span>{c.label}</div>
              <div className="dual-bars">
                <div className="dual-line"><span className="dual-k">CTR</span><div className="dual-track"><div className="dual-fill" style={{width:w(c.ctr),background:'var(--c1)'}}/></div><span className="dual-v">{J.pct(c.ctr,2)}</span></div>
                <div className="dual-line"><span className="dual-k">CVR</span><div className="dual-track"><div className="dual-fill" style={{width:w(c.cvr),background:'var(--c2)'}}/></div><span className="dual-v">{J.pct(c.cvr,2)}</span></div>
              </div>
            </div>);
          })}</div>
        </SectionCard>
      </div>
      <SectionCard title="Détail des campagnes" right={<div className="seg">{['Tous','SMA','SEA'].map((f)=><button key={f} className={filt===f?'on':''} onClick={()=>setFilt(f)}>{f}</button>)}</div>}>
        <div className="table-wrap"><table className="data-table">
          <thead><tr>{cols.map((c)=><th key={c.k} className={c.align==='left'?'tl':'tr'} onClick={()=>setSortK(c.k)}>{c.t}<span className="sort-ar">{sort.k===c.k?(sort.dir<0?' ↓':' ↑'):''}</span></th>)}</tr></thead>
          <tbody>{data.map((r)=>(
            <tr key={r.key}>
              <td className="tl"><span className="lev-chip" style={{background:levierColor(r.levier)}}>{r.levier}</span>{r.label}</td>
              <td className="tr">{fmtFR(r.impressions)}</td><td className="tr">{fmtFR(r.clics)}</td>
              <td className="tr">{J.pct(r.ctr,2)}</td><td className="tr">{J.eur2(r.cpc)}</td>
              <td className="tr">{fmtFR(Math.round(r.leads))}</td>
              <td className={'tr '+(r.cpl>0&&r.cpl<=20?'cell-good':r.cpl>=40?'cell-bad':'')}>{r.cpl>0?J.eur2(r.cpl):'—'}</td>
              <td className="tr">{J.pct(r.cvr,2)}</td>
            </tr>
          ))}</tbody>
        </table></div>
      </SectionCard>
    </div>
  );
}

  const selectedCampus = mode === 'hq' ? null : mode;

  // HQ stats
  const hqStats = useMemo(()=>J.aggregate(rows),[rows]);
  const totalLeads = J.sum(allCampus,'leads');
  const totalVenus = J.sum(allCampus,'venus');

  // Campus-specific stats
  const campusData = useMemo(()=>{
    if (!selectedCampus) return null;
    const c = allCampus.find((x)=>x.campus===selectedCampus)||{leads:0,venus:0,nonVenus:0,confirmes:0,taux:0};
    const sources = J.sourceBreakdown(rows, selectedCampus);
    return { ...c, sources };

  // Network avg (anonymized)
  const netAvg = useMemo(()=>J.networkAvg(rows, selectedCampus),[rows, selectedCampus]);

  const journalEntries = useMemo(()=>{
    if (!campusData) return [];

          <KpiCard label="Présents" value={J.intf(totalVenus)} icon={<Ico d={ICONS.check}/>} iconColor="var(--c2)" sub={`${J.pct(totalLeads>0?totalVenus/totalLeads:0,0)} de présence`}/>

    {id:'simulator',label:'Simulateur JPO',icon:ICONS.sim},
  ];

  return (
    <div className="view">
      {tabBar}
      <div className="campus-banner">
        <div className="campus-banner-info">
          <span className="campus-banner-label">Vue campus</span>
          <span className="campus-banner-name">{selectedCampus}</span>
          <span className="campus-banner-meta">JPO 13 Décembre 2025 · Données anonymisées vis-à-vis des autres campus</span>
        </div>
        <span className="campus-badge campus">Directeur campus</span>
      </div>

      {/* Sub-navigation */}
      <div style={{display:'flex',gap:8}}>
        {subTabs.map((t)=>(
          <button key={t.id} onClick={()=>setSubTab(t.id)} style={{
            display:'flex',alignItems:'center',gap:8,padding:'10px 18px',border:0,borderRadius:13,
            fontSize:13,fontWeight:700,cursor:'pointer',transition:'all .15s',fontFamily:'var(--sans)',
            background:subTab===t.id?'var(--card)':'transparent',
            color:subTab===t.id?'var(--ink)':'var(--muted)',
            boxShadow:subTab===t.id?'var(--shadow-sm)':'none',
          }}>
            <Ico d={t.icon} size={15}/>{t.label}
          </button>
        ))}
      </div>

      {subTab === 'overview' && (
        <>
          {/* KPIs campus */}
          <div className="kpi-row">
            <KpiCard label="Leads" value={J.intf(cd.leads)} icon={<Ico d={ICONS.leads}/>} iconColor="var(--c1)" sub="prospects collectés"/>
            <KpiCard label="Présents" value={J.intf(cd.venus)} icon={<Ico d={ICONS.check}/>} iconColor="var(--c2)" sub={`sur ${J.intf(cd.leads)} leads`}/>
            <KpiCard label="Taux de présence" value={J.pct(cd.taux,0)} tone={cd.taux>=0.3?'good':cd.taux<=0.2?'bad':'warn'} icon={<Ico d={ICONS.chart}/>} iconColor="var(--c5)"
              sub={cd.taux>=0.3?'Objectif atteint':cd.taux<=0.2?'En dessous de l\'objectif':'Proche de l\'objectif'}/>
            <KpiCard label="Non venus" value={J.intf(cd.nonVenus)} icon={<Ico d={ICONS.alert}/>} iconColor="var(--c3)" sub="à relancer"/>
          </div>

          {/* Benchmark anonymisé */}
          <div className="grid grid-2">
            <SectionCard title="Benchmark réseau (anonymisé)" sub="Votre campus vs la moyenne du réseau — sans identification des autres campus">
              <div className="bench-card" style={{padding:0,boxShadow:'none',background:'transparent'}}>
                {[
                  {label:'Leads collectés',mine:cd.leads,avg:Math.round(netAvg.avgLeads),fmt:(v)=>fmtFR(v),higherBetter:true},
                  {label:'Taux de présence',mine:cd.taux,avg:avgTauxReseau,fmt:(v)=>J.pct(v,0),higherBetter:true},
                  {label:'CPL moyen réseau',mine:netAvg.avgCPL,avg:netAvg.avgCPL,fmt:(v)=>J.eur2(v),higherBetter:false,noMine:true},
                ].map((row)=>{
                  const delta = row.noMine ? 0 : (row.mine - row.avg);
                  const positive = row.higherBetter ? delta > 0 : delta < 0;
                  const dSign = delta > 0 ? '+' : '';
                  const dFmt = typeof row.mine === 'number' && !row.noMine ?
                    (row.fmt === J.pct ? null : null) : null;
                  return (
                    <div className="bench-row" key={row.label}>
                      <span className="bench-label">{row.label}</span>
                      <span className="bench-my" style={{color:row.noMine?'var(--muted)':'var(--ink)'}}>
                        {row.noMine?'—':row.fmt(row.mine)}
                      </span>
                      <span className="bench-avg">moy. {row.fmt(row.avg)}</span>
                      {!row.noMine&&<span className={`bench-delta ${positive?'up':'down'}`}>
                        {dSign}{row.higherBetter?(row.mine-row.avg>0?'+':'')+fmtFR(row.mine-row.avg):fmtFR(row.mine-row.avg)}
                      </span>}
                      {row.noMine&&<span className="bench-delta eq">Référence</span>}
                    </div>
                  );
                })}
              </div>
            </SectionCard>

            {/* Origine leads campus */}
            <SectionCard title="Origine des leads" sub={`Sources d'acquisition — ${selectedCampus}`}>
              <div className="donut-row">
                <Donut data={cd.sources.slice(0,6).map((s,i)=>({label:s.source,value:s.leads,color:`var(--c${(i%5)+1})`}))} centerTop={J.intf(cd.leads)} centerSub="leads"/>
                <div className="donut-legend">{cd.sources.slice(0,6).map((s,i)=>(
                  <div className="dl-row" key={s.source}><span className="legend-dot" style={{background:`var(--c${(i%5)+1})`}}/><span className="dl-name">{s.source}</span><span className="dl-val">{J.intf(s.leads)}</span></div>
                ))}</div>
              </div>
            </SectionCard>
          </div>

          {/* Taux présence par source */}
          <SectionCard title="Taux de présence par source" sub="Quelle source amène les leads qui viennent le plus — campus Paris">
            <HBars
              rows={cd.sources.filter((s)=>s.leads>=2).sort((a,b)=>b.taux-a.taux)}
              accessor={(r)=>r.taux}
              label={(r)=>r.source}
              format={(v)=>J.pct(v,0)}
              color={(r)=>r.taux>=0.3?'var(--good)':r.taux<=0.15?'var(--bad)':'var(--warn)'}
            />
          </SectionCard>

          {/* Campagnes SEA + SMA du campus */}
          <SectionCard title="Performance SMA / SEA réseau" sub="Les campagnes médias ont été diffusées sur l'ensemble du réseau — données globales">
            <div className="grid grid-2" style={{gap:'var(--gap)'}}>
              <div>
                <p style={{margin:'0 0 12px',fontSize:12.5,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.04em'}}>SMA · Meta Ads</p>
                <HBars rows={J.creativeAnalysis(rows).creas.filter((c)=>c.leads>0).slice(0,5)} accessor={(r)=>r.leads} label={(r)=>r.name} format={(v)=>fmtFR(v)} color="var(--c1)" maxRows={5}/>
              </div>
              <div>
                <p style={{margin:'0 0 12px',fontSize:12.5,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.04em'}}>SEA · Google Ads</p>
                <HBars rows={J.campaignRows(rows).filter((c)=>c.levier==='SEA')} accessor={(r)=>r.leads} label={(r)=>r.label.replace('Google · ','')} format={(v)=>fmtFR(v)} color="var(--c2)"/>
              </div>
            </div>
          </SectionCard>
        </>
      )}

      {subTab === 'journal' && (
        <SectionCard title="Journal de bord" sub={`Analyse automatique et recommandations — ${selectedCampus}`}>
          <div className="journal">
            {journalEntries.map((entry,i)=>{
              const color = entry.tone==='good'?'var(--good)':entry.tone==='bad'?'var(--bad)':entry.tone==='warn'?'var(--warn)':'var(--c1)';
              return (
                <div className="journal-entry" key={i}>
                  <div className="journal-stripe" style={{background:color}}/>
                  <div className="journal-body">
                    <span className="journal-date">{entry.date}</span>
                    <span className="journal-title">{entry.title}</span>
                    <span className="journal-text">{entry.text}</span>
                    {entry.actions&&<div className="journal-actions">
                      {entry.actions.map((a,j)=>(
                        <button key={j} className={`journal-action-btn ${j===0?'primary':''}`}
                          onClick={()=>{ if(/simulateur/i.test(a)) setSubTab('simulator'); }}>
                          {a}
                        </button>
                      ))}
                    </div>}
                  </div>
                </div>
              );
            })}
          </div>
        </SectionCard>
      )}

      {subTab === 'simulator' && (
        <SimulatorView campusData={cd} netAvg={netAvg} campusName={selectedCampus}/>
      )}
    </div>
  );
}

/* ===== SIMULATEUR JPO ===== */
function SimulatorView({ campusData, netAvg, campusName }) {
  const [budget, setBudget] = useState(1500);
  const [tauxPresRef, setTauxPresRef] = useState(Math.max(campusData.taux, 0.2));
  const [ratioPaidOrganic, setRatioPaidOrganic] = useState(70); // % paid

  // Historical CPL from data
  const historicCPL = netAvg.avgCPL > 0 ? netAvg.avgCPL : 28;
  const historicPres = campusData.taux > 0 ? campusData.taux : 0.22;

  // Estimation
  const paidBudget = budget * ratioPaidOrganic / 100;
  const organicBudget = budget - paidBudget;
  const estimLeadsPaid = historicCPL > 0 ? Math.round(paidBudget / historicCPL) : 0;
  const estimLeadsOrganic = Math.round(organicBudget / 15); // est. €15 CPL organique
  const estimLeadsTotal = estimLeadsPaid + estimLeadsOrganic;
  const estimPresents = Math.round(estimLeadsTotal * tauxPresRef);
  const estimCPL = estimLeadsTotal > 0 ? budget / estimLeadsTotal : 0;
  const estimCPP = estimPresents > 0 ? budget / estimPresents : 0;

  return (
    <SectionCard title="Simulateur JPO" sub={`Projection budgétaire — ${campusName} — basée sur les données historiques`}>
      <div className="simulator">
        <div className="sim-controls">
          <div className="sim-row">
            <span className="sim-label">Budget total</span>
            <input type="range" className="sim-range" min="500" max="5000" step="100" value={budget} onChange={(e)=>setBudget(Number(e.target.value))}/>
            <span className="sim-val">{J.eur(budget)}</span>
          </div>
          <div className="sim-row">
            <span className="sim-label">Part paid (%)</span>
            <input type="range" className="sim-range" min="0" max="100" step="5" value={ratioPaidOrganic} onChange={(e)=>setRatioPaidOrganic(Number(e.target.value))}/>
            <span className="sim-val">{ratioPaidOrganic}%</span>
          </div>
          <div className="sim-row">
            <span className="sim-label">Taux présence cible</span>
            <input type="range" className="sim-range" min="0.10" max="0.80" step="0.01" value={tauxPresRef} onChange={(e)=>setTauxPresRef(Number(e.target.value))}/>
            <span className="sim-val">{J.pct(tauxPresRef,0)}</span>
          </div>
        </div>
        <div className="sim-results">
          <div className="sim-kpi">
            <span className="sim-kpi-label">Leads estimés</span>
            <span className="sim-kpi-value" style={{color:'var(--c1)'}}>{fmtFR(estimLeadsTotal)}</span>
            <span className="sim-kpi-sub">{fmtFR(estimLeadsPaid)} payants · {fmtFR(estimLeadsOrganic)} organiques</span>
          </div>
          <div className="sim-kpi">
            <span className="sim-kpi-label">Présents estimés</span>
            <span className="sim-kpi-value" style={{color:'var(--c2)'}}>{fmtFR(estimPresents)}</span>
            <span className="sim-kpi-sub">à {J.pct(tauxPresRef,0)} de taux de présence</span>
          </div>
          <div className="sim-kpi">
            <span className="sim-kpi-label">CPL estimé</span>
            <span className="sim-kpi-value" style={{color:estimCPL<=25?'var(--good)':estimCPL>=40?'var(--bad)':'var(--warn)'}}>{J.eur2(estimCPL)}</span>
            <span className="sim-kpi-sub">basé sur CPL historique {J.eur2(historicCPL)}</span>
          </div>
          <div className="sim-kpi">
            <span className="sim-kpi-label">Coût / présent</span>
            <span className="sim-kpi-value" style={{color:'var(--c4)'}}>{J.eur2(estimCPP)}</span>
            <span className="sim-kpi-sub">budget total ÷ présents</span>
          </div>
        </div>
        <div style={{background:'color-mix(in srgb,var(--c1) 6%,var(--card-2))',borderRadius:16,padding:16}}>
          <p style={{margin:0,fontSize:12.5,fontWeight:600,color:'var(--ink)',lineHeight:1.6}}>
            <strong style={{display:'block',marginBottom:4}}>Analyse automatique</strong>
            {estimCPL > 0 && estimCPL <= 25 && `Avec un budget de ${J.eur(budget)}, le CPL estimé de ${J.eur2(estimCPL)} est dans la cible. Ce plan est viable.`}
            {estimCPL > 25 && estimCPL <= 40 && `Le CPL estimé de ${J.eur2(estimCPL)} est proche du plafond de 40 €. Envisagez d'augmenter la part organique ou le budget global.`}
            {estimCPL > 40 && `Attention : le CPL estimé de ${J.eur2(estimCPL)} dépasse l'objectif de 40 €. Augmentez le budget ou revoyez le mix paid/organique.`}
            {' '}Sur la base d'un taux de présence cible de {J.pct(tauxPresRef,0)}, vous pouvez espérer <strong>{fmtFR(estimPresents)} présents</strong> à la JPO.
          </p>
        </div>
      </div>
    </SectionCard>
  );
}

Object.assign(window, { DashboardView, CampagnesView, CreatifsView, CampusView });
})();
  </script>

  <!-- APP SHELL (tweaks intégrés inline) -->
  <script type="text/babel">
(function () {
  const { useState, useEffect, useRef } = React;

  const THEMES = {
    soft: {'--paper':'#f4f4f2','--card':'#ffffff','--card-2':'#f7f7f5','--ink':'#1c1c1e','--muted':'#86868b','--line':'#ededec','--accent':'#2f6bff','--c1':'#2f6bff','--c2':'#15b079','--c3':'#f5a623','--c4':'#9b6cff','--c5':'#ff6a5d','--good':'#18a06a','--warn':'#df9526','--bad':'#ff5b50'},
    apple: {'--paper':'#f5f5f7','--card':'#ffffff','--card-2':'#fbfbfd','--ink':'#1d1d1f','--muted':'#86868b','--line':'#e8e8ed','--accent':'#0071e3','--c1':'#0071e3','--c2':'#34a853','--c3':'#ff9f0a','--c4':'#8a5cf6','--c5':'#ff6258','--good':'#1a9e5f','--warn':'#cf8a1f','--bad':'#ff453a'},
    alan: {'--paper':'#f6f1ea','--card':'#ffffff','--card-2':'#fbf6ef','--ink':'#1f1d2b','--muted':'#8b8794','--line':'#ece5db','--accent':'#5a4bf2','--c1':'#5a4bf2','--c2':'#13b486','--c3':'#ffaa3b','--c4':'#c062d8','--c5':'#ff6f61','--good':'#13a877','--warn':'#e0942b','--bad':'#ff6157'},
  };

  const NAV = [
    {id:'dashboard',label:'Dashboard global',icon:'M3 13h7V3H3v10Zm0 8h7v-6H3v6Zm10 0h7V11h-7v10Zm0-18v6h7V3h-7Z'},
    {id:'campagnes',label:'Analyse campagnes',icon:'M4 19V5m0 14h16M8 19v-6m4 6V9m4 10v-8m4 8V7'},
    {id:'creatifs',label:'Analyse créatifs',icon:'M4 5h16v11H4zM4 16l5-5 3 3 4-4 4 4M8 9.5A1.5 1.5 0 1 0 8 6.5a1.5 1.5 0 0 0 0 3Z'},
    {id:'campus',label:'Vue campus',icon:'M12 3 2 9l10 6 10-6-10-6Zm0 18v-6m-6 1.5V12m12 4.5V12'},
  ];

  const DEFAULTS = {theme:'soft',accent:'#2f6bff',density:'confort',showInsights:true,dashLayout:'standard'};
  const ACCENTS = ['#2f6bff','#0071e3','#5a4bf2','#15b079','#ff6a5d'];

  function App() {
    const [tweaks, setTweakState] = useState(DEFAULTS);
    const setTweak = (k, v) => setTweakState((s)=>({...s,[k]:v}));
    const [rows, setRows] = useState(window.JPO_DATASET.rows);
    const [meta, setMeta] = useState(window.JPO_DATASET.meta);
    const [view, setView] = useState('dashboard');
    const [upload, setUpload] = useState({status:'demo',name:null,error:null});
    const [showTweaks, setShowTweaks] = useState(false);
    const fileRef = useRef(null);

    useEffect(()=>{
      const base = THEMES[tweaks.theme]||THEMES.soft;
      const root = document.documentElement;
      Object.entries(base).forEach(([k,v])=>root.style.setProperty(k,v));
      if (tweaks.accent) root.style.setProperty('--accent',tweaks.accent);
      root.setAttribute('data-density',tweaks.density||'confort');
    },[tweaks.theme,tweaks.accent,tweaks.density]);

    async function handleFile(file) {
      if (!file) return;
      setUpload({status:'loading',name:file.name,error:null});
      try {
        const buf = await file.arrayBuffer();
        const parsed = await window.JPO.parseXlsx(buf);
        setRows(parsed);
        setMeta({tempsFort:parsed[0]?.tempsFort||'Import',ecole:parsed[0]?.campus?.split(' ')[0]||'Import',date:'',periode:parsed[0]?.periode||''});
        setUpload({status:'loaded',name:file.name,error:null});
      } catch(e) {
        setUpload({status:'error',name:file.name,error:e.message||'Erreur de lecture'});
      }
    }
    function resetDemo() {
      setRows(window.JPO_DATASET.rows);
      setMeta(window.JPO_DATASET.meta);
      setUpload({status:'demo',name:null,error:null});
    }

    const View = {dashboard:DashboardView,campagnes:CampagnesView,creatifs:CreatifsView,campus:CampusView}[view];
    const navLabel = NAV.find((n)=>n.id===view).label;

    return (
      <div className="app">
        <aside className="sidebar">
          <div className="brand">
            <div className="brand-mark">◆</div>
            <div className="brand-txt"><strong>Galileo</strong><span>Marketing JPO</span></div>
          </div>
          <nav className="nav">
            {NAV.map((n)=>(
              <button key={n.id} className={`nav-item ${view===n.id?'active':''}`} onClick={()=>setView(n.id)}>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"><path d={n.icon}/></svg>
                <span>{n.label}</span>
              </button>
            ))}
          </nav>
          <div className="side-foot">
            <div className="upload-box">
              <p className="ub-title">Source de données</p>
              <p className="ub-name">{upload.status==='demo'?'Démo — JPO ESG Luxe':upload.name}</p>
              {upload.status==='error'?<p className="ub-error">{upload.error}</p>:null}
              <button className="ub-btn" onClick={()=>fileRef.current.click()}>{upload.status==='loading'?'Lecture…':'Importer un .xlsx'}</button>
              {upload.status!=='demo'?<button className="ub-link" onClick={resetDemo}>Revenir à la démo</button>:null}
              <input ref={fileRef} type="file" accept=".xlsx" hidden onChange={(e)=>handleFile(e.target.files[0])}/>
            </div>
          </div>
        </aside>

        <main className="main">
          <header className="topbar">
            <div>
              <p className="crumb">{meta.ecole} · {meta.tempsFort}</p>
              <h1 className="page-title" style={{fontFamily:'var(--sans)'}}>{navLabel}</h1>
            </div>
            <div className="topbar-right">
              <div className="period-chip"><span className="pc-dot"/>{meta.periode||'Période importée'}</div>
              <button className="import-cta" onClick={()=>fileRef.current.click()}>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M12 16V4m0 0L8 8m4-4 4 4M4 20h16"/></svg>
                Importer
              </button>
              <button onClick={()=>setShowTweaks((s)=>!s)} style={{
                padding:'10px 14px',border:'1px solid var(--line)',borderRadius:999,background:'var(--card)',
                fontSize:12.5,fontWeight:700,color:'var(--muted)',cursor:'pointer',fontFamily:'var(--sans)',
              }}>Réglages</button>
            </div>
          </header>
          {upload.status==='loaded'?<div className="flash">Fichier <strong>{upload.name}</strong> chargé — {rows.length} lignes analysées.</div>:null}
          <div className="content">
            <View rows={rows} tweaks={tweaks}/>
          </div>
        </main>

        {/* Tweaks panel */}
        {showTweaks&&(
          <div style={{position:'fixed',right:20,top:80,width:300,background:'var(--card)',borderRadius:20,boxShadow:'var(--shadow-lg)',padding:20,zIndex:1000,display:'flex',flexDirection:'column',gap:14}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:14,fontWeight:800}}>Réglages</span>
              <button onClick={()=>setShowTweaks(false)} style={{border:0,background:'none',fontSize:18,cursor:'pointer',color:'var(--muted)'}}>×</button>
            </div>
            {[
              {label:'Thème',key:'theme',opts:['soft','apple','alan']},
              {label:'Densité',key:'density',opts:['confort','compact']},
              {label:'Disposition',key:'dashLayout',opts:['standard','funnel','compact']},
            ].map((row)=>(
              <div key={row.key} style={{display:'flex',flexDirection:'column',gap:6}}>
                <span style={{fontSize:11.5,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.04em'}}>{row.label}</span>
                <div className="seg">{row.opts.map((o)=><button key={o} className={tweaks[row.key]===o?'on':''} onClick={()=>setTweak(row.key,o)}>{o}</button>)}</div>
              </div>
            ))}
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              <span style={{fontSize:11.5,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.04em'}}>Couleur accent</span>
              <div style={{display:'flex',gap:8}}>{ACCENTS.map((c)=>(
                <button key={c} onClick={()=>setTweak('accent',c)} style={{width:28,height:28,borderRadius:'50%',background:c,border:tweaks.accent===c?'3px solid var(--ink)':'2px solid transparent',cursor:'pointer'}}/>
              ))}</div>
            </div>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <span style={{fontSize:13,fontWeight:700}}>Insights auto</span>
              <button onClick={()=>setTweak('showInsights',!tweaks.showInsights)} style={{
                width:44,height:24,borderRadius:12,border:0,cursor:'pointer',
                background:tweaks.showInsights?'var(--accent)':'var(--line)',transition:'background .2s',position:'relative',
              }}>
                <span style={{position:'absolute',top:2,left:tweaks.showInsights?22:2,width:20,height:20,borderRadius:10,background:'#fff',transition:'left .2s',boxShadow:'0 1px 3px rgba(0,0,0,.2)'}}/>
              </button>
            </div>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
})();
  </script>
